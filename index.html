<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GloamingKit</title>
  <style>
    :root {
      --bg: #14141c;
      --panel: #1d1d29;
      --text: #e8e8f0;
      --muted: #8a8aa0;
      --accent: #7fffd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    /* Fixed to the viewport so the canvas is the whole page and the controls
       float over it. viz.resize() reads clientWidth/Height, which this keeps
       equal to the viewport. */
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Transport: a play button in the middle that steps aside once the song
       is running, handing over to a permanent corner toggle. Both are shown
       and hidden with opacity rather than `display`, so the swap can animate
       and neither ever reflows the page. */
    #play, #toggle {
      position: fixed;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      background: rgba(20, 20, 28, 0.55);
      border: 1px solid rgba(232, 232, 240, 0.25);
      color: var(--accent);
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 0.28s ease, transform 0.28s ease,
                  background 0.2s ease, border-color 0.2s ease;
    }
    #play svg, #toggle svg { width: 52%; height: 52%; fill: currentColor; display: block; }
    #play:hover, #toggle:hover { background: rgba(20, 20, 28, 0.8); border-color: var(--accent); }

    #play { width: 64px; height: 64px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #play.gone { opacity: 0; transform: translate(-50%, -50%) scale(0.7); pointer-events: none; }

    #toggle { width: 36px; height: 36px; top: 16px; left: 16px; opacity: 0; pointer-events: none; }
    #toggle.show { opacity: 1; pointer-events: auto; }

    /* One button, two glyphs — swapped by class so the icon can't drift out
       of sync with a re-render. */
    #toggle .i-play { display: none; }
    #toggle.paused .i-pause { display: none; }
    #toggle.paused .i-play { display: block; }
    aside {
      grid-row: 1 / 3;
      grid-column: 2;
      background: var(--panel);
      padding: 16px;
      overflow-y: auto;
    }
    aside h1 { font-size: 16px; margin: 0 0 4px; color: var(--accent); }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 20px 0 8px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row label { flex: 1; color: var(--muted); }
    input[type="color"] { width: 44px; height: 28px; border: none; background: none; padding: 0; cursor: pointer; }
    input[type="range"] { flex: 1.2; accent-color: var(--accent); }
    input[type="number"] {
      width: 58px; background: var(--bg); color: var(--text);
      border: 1px solid #333344; border-radius: 4px; padding: 4px 6px;
    }
    button {
      background: var(--bg); color: var(--text); border: 1px solid #333344;
      border-radius: 6px; padding: 6px 12px; cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #10101a; border: none; font-weight: 600; }
    #transport {
      grid-row: 2; grid-column: 1;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: var(--panel);
    }
    #seek { flex: 1; accent-color: var(--accent); }
    #clock { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 88px; text-align: right; }
    .tl-window {
      border: 1px solid #333344; border-radius: 8px;
      padding: 8px; margin-bottom: 10px;
    }
    .tl-window .row { margin-bottom: 6px; }
    .tl-vizzes { display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .tl-vizzes label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
    .tl-remove { float: right; padding: 2px 8px; font-size: 12px; }
    #song-name { color: var(--muted); font-size: 12px; word-break: break-all; }
    input[type="file"] { display: none; }
  </style>
  <audio id="song" src="sound2.wav" preload="auto"></audio>
</head>
<body>
  <canvas id="stage"></canvas>

  <button id="play" aria-label="Play" title="Play">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <button id="toggle" aria-label="Pause" title="Pause">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="i-pause" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
      <path class="i-play" d="M8 5v14l11-7z"/>
    </svg>
  </button>

  <!-- Library first, then the demo app that consumes it. Both are classic
       scripts, so this page also works opened straight from disk. -->
  <script src="dist/gloaming-kit.js" defer></script>
  <script src="demo.js" defer></script>
</body>
</html>
